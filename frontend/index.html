<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- The Latin subset is on the critical path for every screen. Preloading
         it removes a round trip that would otherwise land after the CSS. -->
    <link
      rel="preload"
      href="/fonts/figtree-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f4" />

    <title>Ani — Farm to table in Biliran</title>
    <meta
      name="description"
      content="Buy fresh produce straight from farms across Biliran province."
    />

    <!-- Most arrivals are from a shared Facebook or Messenger link, and their
         scrapers do not run JavaScript. Static tags are the stopgap; see
         docs/explanation/architecture.md. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ani" />
    <meta property="og:title" content="Ani — Farm to table in Biliran" />
    <meta
      property="og:description"
      content="Buy fresh produce straight from farms across Biliran province."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
