name: Keep awake

# Render's free tier sleeps a service after 15 minutes idle and takes about a
# minute to wake. Someone arriving from a Facebook link should not spend that
# minute looking at a blank screen.
#
# This does not solve the problem, it moves it to the hours nobody is looking.
# The real fix is a paid instance — see docs/reference/deployments.md.
#
# DISABLED until there is an API to ping. On a private repository every
# scheduled run bills a minimum of one minute, so a no-op every ten minutes
# would spend roughly 100 minutes a day of the free allowance achieving
# nothing. Plan 0001 step 2.3 turns it back on.

on:
  schedule:
    # Every 10 minutes between 21:00 and 14:00 UTC, which is 05:00 to 22:00 PHT.
    - cron: '*/10 21-23,0-14 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: |
          url="${{ vars.API_HEALTH_URL }}"
          if [ -z "$url" ]; then
            echo "API_HEALTH_URL repository variable is not set; nothing to ping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$url")
          echo "health returned $code"
          [ "$code" = "200" ]
